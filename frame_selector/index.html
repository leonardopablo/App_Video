<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: transparent; color: #e6edf3; }
  #wrap { width: 660px; margin: 0 auto; }

  #player-area { position: relative; width: 640px; height: 360px; background: #000; border-radius: 10px; overflow: hidden; }
  #player { width: 100%; height: 100%; }

  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #box {
    position: absolute; top: 0; height: 100%; width: 203px; left: 219px;
    border: 3px solid #00e68a; border-radius: 4px;
    background: rgba(0, 230, 138, 0.10);
    pointer-events: auto; cursor: grab;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
  }
  #box.dragging { cursor: grabbing; background: rgba(0, 230, 138, 0.18); }
  #boxlabel {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    background: #00e68a; color: #06110c; font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: 999px; user-select: none;
  }

  #toolbar { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  button {
    background: #12181f; color: #e6edf3; border: 1px solid #2d3742;
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: #00e68a; }
  #fixbtn { background: #00e68a; color: #06110c; font-weight: 700; border: none; }
  #recbtn.on { background: #5c1010; border-color: #ff4444; color: #ff6b6b; }
  #timelabel { font-family: monospace; font-size: 13px; color: #8b949e; margin-left: auto; }

  #kfs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; min-height: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,230,138,0.08); border: 1px solid rgba(0,230,138,0.3);
    color: #00e68a; border-radius: 999px; padding: 3px 10px; font-size: 12px;
  }
  .chip b { font-family: monospace; font-weight: 600; }
  .chip span.del { cursor: pointer; color: #ff6b6b; font-weight: 700; padding-left: 2px; }
  .hint { color: #8b949e; font-size: 12px; }
  #errmsg { display: none; color: #ff6b6b; font-size: 13px; padding: 8px 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="player-area">
    <div id="player"></div>
    <div id="overlay"><div id="box"><div id="boxlabel">9:16</div></div></div>
  </div>
  <div id="errmsg">⚠️ Este video no permite reproducción embebida. Activa el "modo clásico (fotogramas)" arriba.</div>
  <div id="toolbar">
    <button id="fixbtn">📌 Fijar posición</button>
    <button id="recbtn">🔴 Grabar seguimiento</button>
    <span id="timelabel">--:--</span>
  </div>
  <div id="kfs"><span class="hint">Sin posiciones → recorte centrado. Arrastra el recuadro y fija, o graba el seguimiento con el video en reproducción.</span></div>
</div>

<script>
// ── Protocolo de componente de Streamlit (manual, sin build) ──
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }
function setHeight(h) { send("streamlit:setFrameHeight", { height: h }); }

// ── Estado ──
let args = null, player = null, playerReady = false;
let kfs = [];                 // [{t, cx, cy}]
let rec = false, lastRecT = -10;
const REACT = 0.5;            // compensación del tiempo de reacción humano (s)
const REC_THROTTLE = 0.4;     // mínimo entre muestras durante el arrastre (s)
const W = 640, H = 360;
const box = document.getElementById("box");
// Streamlit monta el iframe sin layout todavía: offsetWidth puede ser 0
// al cargar. Leerlo en el momento de uso, con el ancho CSS de respaldo.
function boxW() { return box.offsetWidth || 203; }

// ── Render desde Python ──
window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const first = (args === null);
  const a = e.data.args;
  const prev = args;
  args = a;
  if (first) {
    if (Array.isArray(a.initial) && a.initial.length && kfs.length === 0) {
      kfs = a.initial.map(k => ({ t: k.t, cx: k.cx, cy: k.cy }));
      renderList();
    }
    initPlayer();
  } else if (playerReady && prev && (prev.start !== a.start || prev.end !== a.end)) {
    player.seekTo(a.start, true);
  }
  setHeight(document.body.scrollHeight + 10);
});
send("streamlit:componentReady", { apiVersion: 1 });

// ── YouTube IFrame API ──
function initPlayer() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player("player", {
    width: W, height: H,
    videoId: args.video_id,
    playerVars: { start: Math.floor(args.start), rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { playerReady = true; player.seekTo(args.start, true); },
      onError: () => { document.getElementById("errmsg").style.display = "block"; setHeight(document.body.scrollHeight + 10); },
    },
  });
};

// ── Bucle: reloj y mantener el fragmento en bucle ──
setInterval(() => {
  if (!playerReady || !player.getCurrentTime) return;
  const t = player.getCurrentTime();
  document.getElementById("timelabel").textContent = hms(t) + " / " + hms(args.end);
  if (t > args.end + 0.3 || t < args.start - 2) player.seekTo(args.start, true);
}, 250);

// ── Grabación: registrar EN EL INSTANTE del arrastre ──
// La posición se registra cuando mueves el recuadro (no por reloj), con
// una compensación de REACT segundos porque el humano persigue al sujeto
// con ~medio segundo de retraso.
function recSample(final) {
  if (!rec || !playerReady || !player.getCurrentTime) return;
  const raw = player.getCurrentTime();
  const t = Math.max(raw - REACT, args.start);
  if (!final && t - lastRecT < REC_THROTTLE) return;
  lastRecT = t;
  addKf(t);
}

// ── Arrastre del recuadro (horizontal) ──
let dragging = false, dragOffX = 0;
box.addEventListener("pointerdown", (e) => {
  dragging = true; dragOffX = e.clientX - box.offsetLeft;
  box.classList.add("dragging");
  box.setPointerCapture(e.pointerId);
});
box.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const x = Math.max(0, Math.min(e.clientX - dragOffX, W - boxW()));
  box.style.left = x + "px";
  updateLabel();
  recSample(false);
});
box.addEventListener("pointerup", (e) => {
  dragging = false; box.classList.remove("dragging");
  box.releasePointerCapture(e.pointerId);
  // Muestra final al soltar: fija la posición de reposo exacta
  recSample(true);
});

// ── Posiciones ──
function currentCx() { return (box.offsetLeft + boxW() / 2) / W; }
function updateLabel() {
  document.getElementById("boxlabel").textContent =
    "9:16 · " + Math.round(currentCx() * 100) + "%";
}
updateLabel();
function addKf(t) {
  t = Math.round(t * 10) / 10;
  kfs = kfs.filter(k => Math.abs(k.t - t) >= 0.3);
  kfs.push({ t: t, cx: Math.round(currentCx() * 1000) / 1000, cy: 0.5 });
  kfs.sort((a, b) => a.t - b.t);
  renderList();
  setValue(kfs);
}
document.getElementById("fixbtn").addEventListener("click", () => {
  if (playerReady) addKf(player.getCurrentTime());
});
document.getElementById("recbtn").addEventListener("click", function () {
  rec = !rec;
  lastRecT = -10;
  this.classList.toggle("on", rec);
  this.textContent = rec ? "⏹ Detener grabación" : "🔴 Grabar seguimiento";
  // Anclar la posición actual al iniciar la grabación (sin compensación:
  // aquí no hay persecución del sujeto, es el punto de partida)
  if (rec && playerReady && player.getCurrentTime) addKf(player.getCurrentTime());
});

function renderList() {
  const el = document.getElementById("kfs");
  if (!kfs.length) {
    el.innerHTML = '<span class="hint">Sin posiciones → recorte centrado. Arrastra el recuadro y fija, o graba el seguimiento con el video en reproducción.</span>';
  } else {
    el.innerHTML = kfs.map((k, i) =>
      `<span class="chip">🕐 <b>${hms(k.t)}</b> · ↔ ${Math.round(k.cx * 100)}%` +
      `<span class="del" data-i="${i}">✕</span></span>`
    ).join("");
    el.querySelectorAll(".del").forEach(d => d.addEventListener("click", () => {
      kfs.splice(parseInt(d.dataset.i), 1);
      renderList();
      setValue(kfs);
    }));
  }
  setHeight(document.body.scrollHeight + 10);
}

function hms(s) {
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60), r = s % 60;
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}:${String(m % 60).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
  return `${m}:${String(r).padStart(2, "0")}`;
}
</script>
</body>
</html>
